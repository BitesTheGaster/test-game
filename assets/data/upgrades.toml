# L8 --- EXECUTION: how you kill. Weight, rate, or reach. These are the three
# axes every damage card in the game is secretly a fraction of, so the milestone
# asks the question outright.
# THE EXECUTION TREE. The first level is three cards and one question: how does
# this run hurt things. Each of them now MULTIPLIES its axis instead of adding a
# flat number, and each also SEEDS the axis, so a milestone is worth something on
# a run that has never touched the axis and worth far more on one that has.
#
# Every card in the tree is one stack, and the two deeper tiers are BRANCHES: a
# tier-2 card is only ever offered to a run holding its parent, and a tier-3 card
# only to a run holding the tier-2 one. A player on the Overload line is never
# shown the fire-rate question. See the MILESTONES page in the manual.
#
# `group` closes siblings for the run and `after` names the parent, and between
# them they are the whole mechanism -- no new state, just two relations the run
# already had.
[[upgrade]]
id = "m8_overload"
name = "Overload"
desc = "All damage +60%."
effect = "ms_damage"
# +60%, so x1.6. The old value was +125% as a flat damage_mul, which is a much
# bigger cold number and a much worse card: it was the same +125% to a run with
# one damage card and to one with eight. x1.6 is smaller on a bare run and larger
# on a built one, and the built one is the run that reaches L32.
value = 0.6
max_stacks = 1
kind = "milestone"
level = 8
group = "execution"

[[upgrade]]
id = "m8_frenzy"
name = "Frenzy"
desc = "Fire rate +60%."
effect = "ms_fire_rate"
# Fire rate is additive in the DENOMINATOR (base / (1 + bonus)), so 0.6 here is
# x1.6 on a run with no fire-rate cards and much more on a run that has them.
value = 0.6
max_stacks = 1
kind = "milestone"
level = 8
group = "execution"

[[upgrade]]
id = "m8_tempest"
name = "Tempest"
desc = "Every weapon fires 4 more projectiles, and 4 becomes 6."
effect = "ms_proj_seed"
# The SEED is the whole reason this card has two effects and not one. A pure
# multiplier on the bonus count is worth literally nothing on a run that has no
# bonus shots -- 0 x 1.5 is 0 -- and this is the only milestone on this line that
# could have been one. The seed is +4 on purpose: Vampire Survivors' own rule is
# that a weapon's top levels are pure extra shots, and on the strongest axis in
# the game a milestone that adds one is not a reward.
#
# One effect that does both, like the other three seed cards: the seed is part of
# the axis and the multiplier is on the axis, so the card states the RESULT --
# "4 becomes 6" -- rather than the two halves, because that is the number the
# player can check against their own weapon.
value = 0.5
max_stacks = 1
kind = "milestone"
level = 8
group = "execution"

# L16 --- EXECUTION, SECOND TIER
# Three groups of two, one per root. A run on the Overload line is asked about
# damage and is NEVER asked about fire rate or projectiles, which is the whole
# reason the tree exists: before it, the L8 answer was a sample of every line.
#
# Each pair is a genuine fork and not "the same card, larger". One is depth -- a
# second multiplier on the axis you already chose -- and the other is a QUESTION
# the depth version does not ask. Depth is the safe pick, and the player should be
# able to take it without thinking; the other one is the interesting pick.
[[upgrade]]
id = "m16_overload_deep"
name = "Overdrive"
desc = "All damage +60% again. Totals 2.2x."
effect = "ms_damage"
value = 0.6
max_stacks = 1
kind = "milestone"
level = 16
group = "execution.dmg"
after = "m8_overload"

[[upgrade]]
id = "m16_overload_bloodied"
name = "Bloodied"
desc = "All damage x3 while you are below half health."
effect = "dmg_low"
# The mirror of Warmblood on the regen side, and on the same 0.5 cut, so the two
# halves of a survive-and-punish answer agree about where "hurt" begins.
value = 2.0
max_stacks = 1
kind = "milestone"
level = 16
group = "execution.dmg"
after = "m8_overload"

[[upgrade]]
id = "m16_frenzy_deep"
name = "Fever"
desc = "Fire rate +60% again. Totals 2.2x."
effect = "ms_fire_rate"
# The total is printed because it is EXACT. The milestone layer is additive within
# itself, so 1 + 0.6 + 0.6 is 2.2 and not 1.6 x 1.6 -- the card can say the number
# because the number is the number, and a player reading four cards at once can
# check it. (An earlier draft of this card deliberately printed no total, on the
# reasoning that fire rate is multiplicative in the denominator. It is, but the
# layer is additive, so the reasoning was about the wrong multiplication and the
# caution cost the card a number it was entitled to.)
value = 0.6
max_stacks = 1
kind = "milestone"
level = 16
group = "execution.rate"
after = "m8_frenzy"

[[upgrade]]
id = "m16_frenzy_settled"
name = "Rooted"
desc = "All damage x2.5 while you give no movement input."
effect = "dmg_still"
value = 1.5
max_stacks = 1
kind = "milestone"
level = 16
group = "execution.rate"
after = "m8_frenzy"

[[upgrade]]
id = "m16_tempest_deep"
name = "Tempest Deep"
desc = "Your extra projectiles are doubled. 4 becomes 8."
effect = "ms_proj"
value = 0.5
max_stacks = 1
kind = "milestone"
level = 16
group = "execution.proj"
after = "m8_tempest"

[[upgrade]]
id = "m16_tempest_pierce"
name = "Skewer"
desc = "Pierce +2, and your pierce bonus is doubled. 2 becomes 4."
effect = "ms_pierce"
# SEED AND MULTIPLIER, exactly like the projectile root and for the same reason:
# a pure multiplier on a pierce count the run has not built is a multiplier on
# zero. It scales the run's OWN pierce and never a weapon's baked-in value, and it
# also widens blast radius and zone damage, because those read the same bonus --
# so the card is felt in every weapon rather than only the ones that pierce.
value = 1.0
max_stacks = 1
kind = "milestone"
level = 16
group = "execution.proj"
after = "m8_tempest"

# L32 --- EXECUTION, THIRD TIER
# Six groups of two, one per SECOND-TIER card rather than one per line. That is
# not tidiness: two second-tier branches on one line are different answers, so
# sharing a group would mean taking one of them silently closes a question the
# run never earned and may not be able to reach.
[[upgrade]]
id = "m32_overload_ruin"
name = "Ruin"
desc = "All damage +80% again. Totals 3.0x."
effect = "ms_damage"
value = 0.8
max_stacks = 1
kind = "milestone"
level = 32
group = "execution.dmg.deep"
after = "m16_overload_deep"

[[upgrade]]
id = "m32_overload_guillotine"
name = "Guillotine"
desc = "All damage x4 against anything below half health."
effect = "ms_execute"
# The only milestone in the game that is about the TARGET rather than the player,
# and the reason it exists: the first Execution tree made this slot a bigger
# damage number, which is the one thing the design said a branch must not be. A
# branch that asks "what are you hitting" is a different question from "how hard".
value = 3.0
max_stacks = 1
kind = "milestone"
level = 32
group = "execution.dmg.deep"
after = "m16_overload_deep"

[[upgrade]]
id = "m32_bloodied_wrath"
name = "Wrath"
desc = "All damage x2 while you are below half health, on top of the x3. Totals x6."
effect = "dmg_low_deeper"
# ACCUMULATES rather than assigning, which is why it is its own effect id instead
# of a second dmg_low: the tier-2 card already owns that factor, and a second
# dmg_low would overwrite it with the same number -- so the card would have
# silently done nothing. The card prints the product because here both factors are
# known and whole, so the total is something the player can check.
value = 1.0
max_stacks = 1
kind = "milestone"
level = 32
group = "execution.dmg.low"
after = "m16_overload_bloodied"

[[upgrade]]
id = "m32_bloodied_secondwind"
name = "Second Wind"
desc = "All damage x2.5 below a quarter health instead of a half. Totals x7.5."
effect = "dmg_low_tighter"
# The other answer to the same question: not a bigger multiplier on a wider band
# but a tighter band. With Wrath, the fork is the difference between "hurt" and
# "nearly dead" being two different places to be standing, which makes it a choice
# about RISK rather than about arithmetic.
# The threshold is part of the EFFECT and not a field on the card, for the same
# reason the seed is: one id that means one complete promise. A card that could
# set its own cut would be a card where the number the player reads is not the
# number the code uses, and this one carried a `threshold = 0.25` line for two
# rounds that the loader never read -- the card multiplied correctly and the
# quarter-health band silently stayed a half-health band.
value = 1.5
max_stacks = 1
kind = "milestone"
level = 32
group = "execution.dmg.low"
after = "m16_overload_bloodied"

[[upgrade]]
id = "m32_frenzy_blizzard"
name = "Blizzard"
desc = "Fire rate +80% again. Totals 3.0x."
effect = "ms_fire_rate"
value = 0.8
max_stacks = 1
kind = "milestone"
level = 32
group = "execution.rate.deep"
after = "m16_frenzy_deep"

[[upgrade]]
id = "m32_frenzy_cadence"
name = "Cadence"
desc = "Fire rate x2 while you give no movement input."
effect = "ms_still_rate"
# Conditional RATE rather than conditional damage, and the reason is a build
# shortage rather than a clever trick: a run that answered "I stand still and
# shoot" runs out of triggers long before it runs out of damage. Making the
# condition a SHARED one also forces the two halves of a stationary build to
# agree, which is the point -- two cards that happen to say the same words can
# disagree about what counts as still.
value = 1.0
max_stacks = 1
kind = "milestone"
level = 32
group = "execution.rate.deep"
after = "m16_frenzy_deep"

[[upgrade]]
id = "m32_rooted_anchor"
name = "Anchor"
desc = "All damage x1.6 while you give no movement input, on top of the x2.5."
effect = "dmg_still_deeper"
value = 0.6
max_stacks = 1
kind = "milestone"
level = 32
group = "execution.rate.still"
after = "m16_frenzy_settled"

[[upgrade]]
id = "m32_rooted_pillar"
name = "Pillar"
desc = "All damage x2.5 while you give no movement input, and you regenerate 3 HP/s while you do, tripled."
effect = "ms_still_survival"
# The only third-tier card in the tree whose second half is not damage, and it is
# here because of what Rooted asks: stand still, in a game about being surrounded.
# A stationary build spends its time not shooting, and the honest answer to that is
# not more damage -- it is that standing still now feeds you as well.
#
# It REPLACES the damage factor rather than adding to it, so a run cannot stack
# Pillar on Anchor. The two are the same question asked at two sizes, and a tree
# that let the same question be answered twice would be a tree with repeats in it,
# which is the thing the tree replaced.
#
# The regeneration half seeds 3 HP/s of its own rather than only multiplying what
# the run has: nothing on the Execution branch has ever added regeneration, so a
# pure multiplier here was three times zero. The text says "3 HP/s ... tripled" and
# the 3 is inside the multiplier, the same convention the Survivor seeds use.
value = 2.0
max_stacks = 1
kind = "milestone"
level = 32
group = "execution.rate.still"
after = "m16_frenzy_settled"

[[upgrade]]
id = "m32_tempest_deep"
name = "Tempest Ruin"
desc = "Your extra projectiles are quadrupled. 4 becomes 16."
effect = "ms_proj"
# 2.0 on top of the 1.5 the line already has, because the layer is additive: the
# root seeded +4 at x1.5, this card's parent took it to x2, and a third 0.8 would
# have been x3.8 -- a 15 -- for a card that says 16. The value is the one that
# makes the printed total true, which is the only way to choose between them.
value = 2.0
max_stacks = 1
kind = "milestone"
level = 32
group = "execution.proj.deep"
after = "m16_tempest_deep"

[[upgrade]]
id = "m32_tempest_hail"
name = "Hail"
desc = "Pierce +2, and your pierce bonus is tripled. 2 becomes 6."
effect = "ms_pierce"
# The depth half of this pair, and the third card to use this one effect: the seed
# lives in the effect rather than in the card, which is why this one has no effect
# id of its own. 2 at x2 from the second tier is not inherited here -- nothing on
# THIS branch has ever added a pierce -- so the card seeds its own 2 and the
# printed 6 is 2 at x3.
value = 2.0
max_stacks = 1
kind = "milestone"
level = 32
group = "execution.proj.deep"
after = "m16_tempest_deep"

[[upgrade]]
id = "m32_skewer_spine"
name = "Spine"
desc = "Pierce +2, and your pierce bonus is tripled. Half a body's armour stops mattering."
effect = "ms_pierce_armour"
# The other half of this pair, and the better third tier: Skewer said "your shots
# go through more bodies", and a body you are already hitting four times is a body
# whose defence you are paying four times. Half is a FRACTION of the defence rather
# than a flat 50, so it still means something against a late enemy -- a flat number
# is everything against trash and nothing against a boss.
value = 1.0
max_stacks = 1
kind = "milestone"
level = 32
group = "execution.proj.pierce"
after = "m16_tempest_pierce"

[[upgrade]]
id = "m32_skewer_lattice"
name = "Lattice"
desc = "Pierce +6, and your pierce bonus is multiplied fivefold. Every blast is 40% wider."
effect = "ms_pierce_area"
# The other third tier on this pair, and a different question from Spine: MORE
# bodies rather than HARDER ones, with the area scale along for the ride. A run
# that chose to hit everything should get a bigger everything; a run that chose to
# cut through armour should get better at that instead.
# The 40% is inside ms_pierce_area for the same reason the quarter is inside
# dmg_low_tighter: a card's data should be the thing a designer edits, and a
# half-read card is a card with two sources of truth and only one of them loaded.
value = 3.0
max_stacks = 1
kind = "milestone"
level = 32
group = "execution.proj.pierce"
after = "m16_tempest_pierce"

# L16 --- ELEMENT: what your hits leave on them. Three mutually exclusive answers
# to "how do you want a body to feel", applied from the one place every point of
# player damage goes through, so they work from every weapon without any weapon
# knowing marks exist.
#
# Three roots and not four, and the fourth mark moved into the Hex branch. That is
# what makes the per-mark multiplier mean anything: the group is exclusive, so a
# run holds exactly ONE root, and a multiplier on "all four marks" was always a
# multiplier on the one it had. The Hex line is the exception -- it can take Armour
# Split as well, so it is the one run in the game carrying two marks. The other two
# lines are the pure "go deep in one mark" answer, and the fork between them and Hex
# is the fork this tree exists to ask.
#
# FOUR multipliers, and each reaches ONLY the mark it belongs to. That is the rule
# the whole tree is built on and the reason a run can hold two marks at all: a
# shared "your marks count 60% stronger" would make the Hex line's strip stronger
# for having a Hex it never asked about, and the split's own card -- which prints a
# number and a "60% stronger" of its own -- would be a lie in the direction that
# makes the card look good. The applier reads four separate folds for the same
# reason: `markBurn * (1 + markBurnMul)`, and so on, with the second halves of a
# mark folded by THAT mark's multiplier and not by the branch's. It was the other
# way round for two of the four numbers when this tree first went in, and a mark
# whose multiplier covered some of its own effects was not a rule anyone could plan
# a build around.
#
# The consequence worth stating: no run can ever hold two of the four multipliers,
# because each one is seeded by a card in a line only one run may enter. Two
# multipliers would need a run that went wide, and this tree is built to make going
# wide impossible.
#
# Every card here is ONE STACK. The tree replaces the repeats, the same bargain
# Survivor and Execution made: taking this at L16 is not the first of three, it is
# the only time this group will ever open.
[[upgrade]]
id = "m16_emberbrand"
name = "Emberbrand"
desc = "Every hit sets it alight: 35 burning damage a second, and your burn counts 60% stronger."
effect = "ms_mark_burn_seed"
# The seed is inside the multiplier, so the card prints 35 and not 22 -- the same
# convention as the Survivor and Execution roots, and the reason the printed number
# is the one the damage tick actually shows.
value = 0.6
max_stacks = 1
kind = "milestone"
level = 16
group = "element"

[[upgrade]]
id = "m16_hex"
name = "Hex"
desc = "Every hit makes that body take 22% more damage, up to +179%."
effect = "ms_mark_vuln_seed"
# Both numbers are multiplied, not just the step. The old card printed "+14% per
# hit, up to +84%" and delivered +112% at the ceiling, because the ceiling was
# built from the raw seed while the step went through the multiplier -- a card
# whose two halves disagreed with each other, which is the only kind of rounding
# error a player can actually notice.
value = 0.6
max_stacks = 1
kind = "milestone"
level = 16
group = "element"

[[upgrade]]
id = "m16_frostbind"
name = "Frostbind"
desc = "Every hit chills what it strikes for 4s, and the chill counts 60% stronger."
effect = "ms_mark_chill_seed"
# The multiplier reaches the DEPTH of the slow as well as how long it lasts. A card
# that scaled only the duration would have spent its whole number on the smaller
# of the two things it was scaling, and a player would have seen the same 60% slow
# on a 4-second debuff and wondered what they had bought.
value = 0.6
max_stacks = 1
kind = "milestone"
level = 16
group = "element"

# L32 --- ELEMENT, SECOND TIER. Six groups of two, one pair per root. Each root
# splits into "more of the same mark" and "the same mark doing something else",
# because a tree whose second tier is two versions of the first is a list.
[[upgrade]]
id = "m32_ember_deep"
name = "Emberbrand Deep"
desc = "35 becomes 70 burning damage a second."
effect = "ms_mark_burn_deeper"
# Accumulates, because the root's 60% is still sitting underneath. 35.2 at x2 is
# 70.4, and the card prints 70 because 70 is a damage number a weapon can be
# compared against.
value = 1.0
max_stacks = 1
kind = "milestone"
level = 32
group = "element.burn"
after = "m16_emberbrand"

[[upgrade]]
id = "m32_ember_spread"
name = "Emberbrand Spread"
desc = "The burn jumps to two bodies either side."
effect = "ms_mark_burn_spread"
# A count of BODIES and not a radius, because a radius makes the card's reach a
# function of how the enemies happen to be standing and a swarm build would get a
# different card out of the same sentence. The radius is a constant in the applier
# and the number on the card is the number that matters.
value = 2.0
max_stacks = 1
kind = "milestone"
level = 32
group = "element.burn"
after = "m16_emberbrand"

[[upgrade]]
id = "m32_hex_deep"
name = "Hex Deep"
desc = "The ramp is steeper and the ceiling higher: 45% per hit, up to +358%."
effect = "ms_mark_vuln_deeper"
# Both halves move together, and they have to: a steeper step under an unchanged
# ceiling is a card that reaches its own limit in fewer hits and then does nothing,
# which is strictly worse than a card that never ramped at all.
value = 1.0
max_stacks = 1
kind = "milestone"
level = 32
group = "element.hex"
after = "m16_hex"

[[upgrade]]
id = "m32_hex_split"
name = "Armour Split"
desc = "Every hit also strips 35 of the target's own armour, and the stripping counts 60% stronger."
effect = "ms_mark_split_seed"
# The fourth mark, moved off the root row and down a branch. It is the only way a
# run ever holds two marks, and it sits under Hex rather than beside it because
# softening a body and then taking its armour off is one idea in two steps, while
# setting a body alight and taking its armour off is two ideas.
value = 0.6
max_stacks = 1
kind = "milestone"
level = 32
group = "element.hex"
after = "m16_hex"

[[upgrade]]
id = "m32_frost_deep"
name = "Frostbind Deep"
desc = "4s becomes 8s of chill."
effect = "ms_mark_chill_deeper"
value = 1.0
max_stacks = 1
kind = "milestone"
level = 32
group = "element.frost"
after = "m16_frostbind"

[[upgrade]]
id = "m32_frost_slow"
name = "Frostbind Slow"
desc = "Chilled bodies are slowed 50% harder."
effect = "ms_mark_chill_mul"
# The DEPTH, not the duration: a second axis on the same card, and the reason a
# run can hold a body nearly still without any of it coming from the ice weapons'
# own freeze. Depth is clamped at zero in the applier, so a card can make a chill
# stop mattering but never make it push.
value = 0.5
max_stacks = 1
kind = "milestone"
level = 32
group = "element.frost"
after = "m16_frostbind"

# L64 --- ELEMENT, THIRD TIER. Twelve cards, six groups of two, one pair per
# second-tier card. Six pairs means six places where the answer to "how do you want
# a body to feel" can stop being "harder" and start being something else, which is
# the only reason to go this deep.
[[upgrade]]
id = "m64_ember_ruin"
name = "Emberbrand Ruin"
desc = "70 becomes 140 burning damage a second."
effect = "ms_mark_burn_deeper"
value = 1.0
max_stacks = 1
kind = "milestone"
level = 64
group = "element.burn.deep"
after = "m32_ember_deep"

[[upgrade]]
id = "m64_ember_cinder"
name = "Emberbrand Cinder"
desc = "Bodies that burn are also slowed, for 1.6s."
effect = "ms_mark_burn_chill"
# The thing a fire mark obviously ought to do and never did. A body that is alight
# and walking away is a body the player cannot catch, and the answer to that is
# control rather than more damage -- which is why this is a sibling of "more burn"
# and not a fourth step along it.
value = 1.0
max_stacks = 1
kind = "milestone"
level = 64
group = "element.burn.deep"
after = "m32_ember_deep"

[[upgrade]]
id = "m64_ember_flare"
name = "Emberbrand Flare"
desc = "The burn jumps to four bodies either side."
effect = "ms_mark_burn_spread"
# The same effect as the second tier at a bigger count, deliberately. Two ids for
# one behaviour is a card waiting to be miswritten: the next author picks the
# "deeper" one, nothing says the two differ, and the number on the card stops
# matching. This card prints four because 2 plus 2 is 4.
value = 2.0
max_stacks = 1
kind = "milestone"
level = 64
group = "element.burn.spread"
after = "m32_ember_spread"

[[upgrade]]
id = "m64_ember_wildfire"
name = "Emberbrand Wildfire"
desc = "A burn outlives its last hit for 8s."
effect = "ms_mark_burn_window"
# The window, and not the damage: how long a body stays lit decides how much of a
# slow weapon's damage the burn is actually worth, which makes it the answer to a
# question the burn branch has not otherwise asked.
value = 1.0
max_stacks = 1
kind = "milestone"
level = 64
group = "element.burn.spread"
after = "m32_ember_spread"

[[upgrade]]
id = "m64_hex_grievous"
name = "Hex Grievous"
desc = "The ramp is steeper and the ceiling higher: 67% per hit, up to +537%."
effect = "ms_mark_vuln_deeper"
# Half the second tier's step rather than all of it, and the reason is the ceiling:
# a run holding this takes a body to nearly six times the damage it was taking,
# and doubling THAT is a number the card could print and no player could use.
value = 0.5
max_stacks = 1
kind = "milestone"
level = 64
group = "element.hex.deep"
after = "m32_hex_deep"

[[upgrade]]
id = "m64_hex_armour"
name = "Hex Rupture"
desc = "Every hit also strips 22 of the target's own armour."
effect = "ms_mark_vuln_armour"
# A card rather than the second mark, because the run is already standing in this
# line: the body it applies to is the body they have been softening since L16, and
# sending them back to a different root for the other half would mean abandoning
# the tree they are in.
#
# NO 60% on the strip, and that is load-bearing. The four mark multipliers are
# per-mark, this run never took the card that seeds one for the strip, and a card
# quietly borrowing Hex's would be the one place the rule leaked -- invisibly, as a
# strip that is simply stronger than the player had any way to predict.
value = 22.0
max_stacks = 1
kind = "milestone"
level = 64
group = "element.hex.deep"
after = "m32_hex_deep"

[[upgrade]]
id = "m64_split_ruin"
name = "Armour Split Ruin"
desc = "35 becomes 70 armour stripped per hit."
effect = "ms_mark_defstrip_deeper"
value = 1.0
max_stacks = 1
kind = "milestone"
level = 64
group = "element.hex.split"
after = "m32_hex_split"

[[upgrade]]
id = "m64_split_brittle"
name = "Armour Split Brittle"
desc = "A stripped body takes 32% more damage from everything."
effect = "ms_mark_defstrip_vuln"
# A flat factor and not a ramp, stored apart from Hex's `vuln` for the reason the
# two fields are apart: vuln grows with every hit and stops at a ceiling, and a
# card that says "32% more from everything" is describing neither of those things.
#
# The 32 is 20 at the strip's own x1.6, and the card prints the RESULT. The
# multiplier belongs to the STRIP rather than to the branch, so this is the one
# second half in the tree that a run reaches through a mark other than the root it
# was seeded by -- and it is the reason the strip is the only mark with a multiplier
# of its own to spend.
value = 0.2
max_stacks = 1
kind = "milestone"
level = 64
group = "element.hex.split"
after = "m32_hex_split"

[[upgrade]]
id = "m64_frost_permafrost"
name = "Frostbind Permafrost"
desc = "8s becomes 16s of chill."
effect = "ms_mark_chill_deeper"
value = 1.0
max_stacks = 1
kind = "milestone"
level = 64
group = "element.frost.deep"
after = "m32_frost_deep"

[[upgrade]]
id = "m64_frost_brittle"
name = "Frostbind Brittle"
desc = "A chilled body takes 40% more damage from everything."
effect = "ms_mark_chill_brittle"
# The Frostbind answer to the Hex branch's Rupture, and the reason both branches
# get one: a mark that only makes a body easier to hit differently from the other
# two marks would leave one third of the tree as "more of the same".
#
# 25 at Frostbind's x1.6 is 40, and the card prints the 40. The multiplier goes
# through EVERY second half of the chill for the same reason it goes through the
# duration: the root says the chill counts 60% stronger, and a root whose claim
# covered only the number printed on its own card would be a claim about half of
# what it does.
value = 0.25
max_stacks = 1
kind = "milestone"
level = 64
group = "element.frost.deep"
after = "m32_frost_deep"

[[upgrade]]
id = "m64_frost_glacier"
name = "Frostbind Glacier"
desc = "Chilled bodies are slowed 50% harder again."
effect = "ms_mark_chill_mul"
value = 0.5
max_stacks = 1
kind = "milestone"
level = 64
group = "element.frost.slow"
after = "m32_frost_slow"

[[upgrade]]
id = "m64_frost_hoar"
name = "Frostbind Hoarfrost"
desc = "Every hit also strips 35 of the target's own armour."
effect = "ms_mark_chill_armour"
# The same words as Hex Rupture and a different route to them, which is the point:
# one comes from the mark that softens a body and one from the mark that holds it
# still, and a run that has done neither is being offered the same sentence twice
# for two different builds.
#
# 22 at Frostbind's x1.6 is 35, and 35 is also what a player holding Armour Split
# gets from its own 22 -- which is a coincidence, not a shared field, and the two
# runs cannot be the same run. Two cards printing the same number for two different
# reasons is a fair thing to notice on a card screen; one card printing a number
# because it read a field it was not named after is not.
value = 22.0
max_stacks = 1
kind = "milestone"
level = 64
group = "element.frost.slow"
after = "m32_frost_slow"


# L32 --- MOMENTUM: what the kill chain is FOR. The meter is the one part of the
# run that is not a bought number, so the milestone asks what it is worth rather
# than adding a fourth flat multiplier to it.
