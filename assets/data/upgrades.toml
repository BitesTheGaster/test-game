group = "survivor"

# L8 --- EXECUTION: how you kill. Weight, rate, or reach. These are the three
# axes every damage card in the game is secretly a fraction of, so the milestone
# asks the question outright.
[[upgrade]]
# The three EXECUTION members share one stack count on purpose. The group is a
# single question, and a question whose three answers have three different
# numbers of "how many more times can I take this" stops being one question.
# They also each beat the best REPEATABLE card on their own axis, per take
# and over the whole run -- see the test that enforces it.
id = "m8_overload"
name = "Overload"
desc = "All damage +55%"
effect = "damage_mul"
value = 0.55
max_stacks = 2
kind = "milestone"
level = 8
group = "execution"

[[upgrade]]
id = "m8_frenzy"
name = "Frenzy"
desc = "Fire rate +40%"
effect = "fire_rate"
value = 0.40
max_stacks = 2
kind = "milestone"
level = 8
group = "execution"

[[upgrade]]
id = "m8_tempest"
name = "Tempest"
desc = "Every weapon fires 3 more projectiles"
effect = "proj_add"
# +3, and a whole number on purpose. This used to be +1 -- the exact number a
# plain Twin Shot hands out for a repeatable card, and half of a plain Barrage --
# and on the strongest axis in the game, where Vampire Survivors' own rule is
# that a weapon's top levels are pure extra shots, a milestone that adds one is
# not a reward.
#
# It has to be a whole number because the applier casts the value to int: a
# tempting +2.5 here truncates to +2 and the card silently does less than it
# says, and anything under 1.0 truncates to nothing at all. There is a test for
# that, and it is why the number is 3 and not 2.5.
value = 3
max_stacks = 2
kind = "milestone"
level = 8
group = "execution"

