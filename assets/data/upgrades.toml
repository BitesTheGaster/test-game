# Level-up upgrades. effect = id understood by applyUpgrade() (global) or
# applyWeaponEffect() (when `weapon` is set), value = per-stack magnitude.
# Multiple entries may share an effect; max_stacks keeps each variant bounded.
#
# kind:
#   normal    - everyday pool
#   unique    - rare treasure card offered at ~45% per level-up, one-time
#   milestone - offered on every power-of-two level from 4 on (4, 8, 16, 32,
#               64, 128, ...); def.level gates which level it belongs to.
# weapon: non-empty => the card only appears while that weapon is owned, and
#   applies to that weapon slot instead of the player.
#
# Attack speed uses the ADDITIVE fire-rate model: the final delay between
# shots is `base / (1 + totalBonus)` (see attackCooldown in game.hpp). All
# `fire_rate` values are positive percentages (0.1 = +10% fire rate).

