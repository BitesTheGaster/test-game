# The arsenal is 4 weapons wide to begin with, and this is the only way past that.
# It used to exist twice -- a common 3-stack card and a unique 1-stack one that
# promised "your arsenal holds eight". That is two level-up screens spent on the
# same decision, and the second one was wrong about the number too: 4 + 3 is 7.
#
# `slot = false`, and this is the reason the flag exists. Spending one of a
# scarce pool of item slots on "you may hold one more weapon" is a tax on the
# exact card that widens the build, so the card that adds capacity is never
# charged for it.
[[upgrade]]
id = "u_arsenal_core"
name = "Arsenal Core"
desc = "+1 weapon slot"
effect = "weapon_slot_add"
value = 1
max_stacks = 3
slot = false
# --- Improving your weapons is an ITEM ----------------------------------------
#
# A weapon gets better because you picked a card off the level-up screen, and
# because that card stacks. There is no hidden bump for levelling: a free
# per-level upgrade to every weapon is a stat axis nobody chose, and it hands out
# more than the cards the player actually picked by the end of a long run.
#
# These are the axes the player-stat cards do not cover, because they are the
# WEAPON's own geometry rather than a multiplier on the damage coming out of it.
#
# There used to be four of them, and two of those four (`w_all_damage`,
# `w_all_rate`) were the global damage and fire-rate cards wearing a hat. They
# scaled each weapon's own `damage` and `cdBonus` instead of `damageMul` and
# `fireRateBonus`, which is a real difference to the code and no difference at all
# to the player reading the card -- hence "Every weapon you own hits 8% harder"
# sitting in the pool next to "+15% damage", two cards for one axis. Both are
# gone. `stats_.damageMul` is multiplied in at every damage site and
# `fireRateBonus` at every cooldown, so the surviving cards reach everything the
# deleted ones did, and the pause sheet now prints the EFFECTIVE number
# (weapon damage x damageMul) so the sheet cannot drift away from the truth again.
#
# What is left is genuinely orthogonal: reach, how far something is thrown, and
# the weapon count itself. All three are ORDINARY items: they come up in the
# normal pool, they are not milestones, and nothing about them is exclusive.
[[upgrade]]
