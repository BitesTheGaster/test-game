# --- Milestones (every power-of-two level from 4 on) -------------------------
#
# A milestone is an EXCLUSIVE GROUP, and a group is a question you answer once
# and then lean on. Every card of the group is laid out on the same screen; the
# player takes exactly one; every other card in that group is closed off for the
# rest of the run, at a milestone or anywhere else. `group` names the set.
#
# The card you took stays in the game. It keeps its own `max_stacks`, so the same
# group comes back at a later milestone with the siblings gone and your answer
# waiting to be taken again, and each take lands one more time. That is what
# "vampirism, several times over" has to mean once the other two answers are
# locked out for good: not one pick that quietly applies three times, but a card
# that can drop three times and that you can see counting.
#
# So every card in a group has max_stacks >= 2. A group whose members were all
# one-stack would be a one-time decision dressed up as a recurring one, and the
# player would never see the same question twice.
#
# Why it works this way: the milestone pool used to be three flat stat cards of
# which two were shown, so the screen said "damage, or more damage, or yet more
# damage" and the only real decision was which number was printed larger. Now the
# members of a group are different ANSWERS -- vampirism against regeneration
# against a shield, chill against fire against hex against splitting armour -- and
# the screen is as wide as the question is, up to four cards. A group the player
# has already answered fills the leftover slot at a later milestone, so the run
# gets its fresh question AND gets to compound the old one on the same screen.

# L4 --- SURVIVOR: how you outlast it. Three ways to be harder to kill, and the
# run commits to one of them for good.
#
# This group is the worked example of the milestone TREE, and it is the group's
# first member rather than a new group because the tree is the natural evolution
# of what was already here. What it used to be: three flat stat cards with three
# different stack counts, of which the run could take the same one twice at the
# next milestone. What it is now: one question at level 4, then a choice of two
# answers to THAT answer at level 8, then a choice of two at level 16.
#
# Three rules hold the whole tree together and each of them is load-bearing:
#
#  1. A milestone MULTIPLIES the axis, it does not add to it. A flat "+9%
#     lifesteal" is worth exactly as much to a run that engaged one lifesteal
#     card as to one that engaged eight, so it is a number rather than a reward.
#     Every card below carries a multiplier, so the tier pays out for depth.
#
#  2. A tier-1 card therefore ALSO seeds a flat amount, because a pure
#     multiplier is worth nothing to a run that has not engaged the axis at all
#     -- x1.6 on zero lifesteal is zero lifesteal, which is a dead card on the
#     only screen it can first appear on. The seed opens the axis; the multiplier
#     is what makes going deeper worth it.
#
#  3. Branches are `after` a parent card and siblings are a `group`, so the tree
#     needs no new state: the run already remembered which milestone cards it
#     held. A player who took Crimson Pact sees two lifesteal answers at level 8
#     and neither of the other four.
#
# The two branch shapes the design asked for by name are here verbatim: regen
# that is super-fast while you stand still (Stillness Bloom, and Deep Stillness
# which is its stronger sibling), and an instant heal after a few seconds without
# damage (Wound Echo, and Red Mend which shortens the wait). The user's own
# verdict on that pair was that it is unbalanced; it is shipped anyway, because
# the point of the round was the SHAPE, and the numbers are on the card where they
# can be argued with.
[[upgrade]]
id = "m4_crimson"
name = "Crimson Pact"
desc = "Lifesteal 11% per kill. Everything else you add to lifesteal counts 60% stronger."
effect = "ms_lifesteal_seed"
value = 0.6
max_stacks = 1
kind = "milestone"
level = 4
group = "survivor"

[[upgrade]]
id = "m4_renewal"
name = "Verdant Renewal"
desc = "Regeneration 1.75 HP/s. Everything else you add to regeneration counts 75% stronger."
