# Level-up upgrades. effect = id understood by applyUpgrade() (global) or
# applyWeaponEffect() (when `weapon` is set), value = per-stack magnitude.
#
# ONE CARD PER AXIS. Two cards may share an `effect` only if they are for
# different `weapon` slots; among the global cards every effect appears exactly
# once. This used to be the other way round -- four damage cards, four fire-rate
# cards, four max-HP cards, three pierce-range cards -- and it read to the player
# as fourteen separate items when it was thirteen axes, because nothing said they
# were the same thing. A card list is not a build menu. Each family is now one
# card with a raised `max_stacks`, and the per-stack `value` is re-derived so the
# family still ends near where it used to: 4x0.15 + 4x0.25 + 2x0.35 = +2.60
# damage became 8x0.30 = +2.40, a little under the old ceiling because the card
# is now competing for one of eight slots instead of being one of four cards that
# all said the same thing.
#
# The plain card's new CEILING is what the milestone numbers are checked against,
# and raising max_stacks moved it: an 8-take fire-rate card reaches +144% where
# the old family reached +147% across ten takes, and a milestone that used to beat
# its axis on the whole run no longer does. The four that lost were re-tuned up
# rather than the plain cards tuned down, because a milestone is the reward for
# closing two other axes and it costs no slot -- it has to be worth more, not
# less, now that the repeatable card is competing for a scarce one.
#
# kind:
#   normal    - everyday pool
#   unique    - rare treasure card offered at ~45% per level-up, one-time
#   milestone - offered on every power-of-two level from 4 on (4, 8, 16, 32,
#               64, 128, ...); def.level gates which level it belongs to.
# weapon: non-empty => the card only appears while that weapon is owned, and
#   applies to that weapon slot instead of the player.
# slot: whether the card occupies one of the player's limited ITEM SLOTS. True by
#   default for every kind except `unique`; set `slot = false` to exempt a card
#   that is not a stat axis (see u_arsenal_core). The slot count is the run's
#   power curve -- 1 at level 1, then one more at every power of two -- so the
#   thing worth limiting is a card that improves EVERY weapon at once. A card for
#   one weapon cannot stack its way to that, and a unique is a once-per-run
#   treasure, so neither of them spends a slot.
#
# Attack speed uses the ADDITIVE fire-rate model: the final delay between
# shots is `base / (1 + totalBonus)` (see attackCooldown in game.hpp). All
# `fire_rate` values are positive percentages (0.1 = +10% fire rate).

