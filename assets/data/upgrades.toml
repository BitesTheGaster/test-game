# --- Improving your weapons is an ITEM ----------------------------------------
#
# A weapon gets better because you picked a card off the level-up screen, and
# because that card stacks. There is no hidden bump for levelling: a free
# per-level upgrade to every weapon is a stat axis nobody chose, and it hands out
# more than the cards the player actually picked by the end of a long run.
#
# These four are the axes the player-stat cards do not cover, because they are
# the WEAPON's own geometry rather than a multiplier on the damage coming out of
# it. `w_all_damage` and `w_all_rate` overlap with the global damage and fire-rate
# cards on purpose: they edit each weapon's own number, which is what the sheet
# shows and what a weapon's derived numbers (a Nova's tick, a Zone's dps) are
# built from, so they keep paying after a later card changes the multiplier.
#
# All four are ORDINARY items: they come up in the normal pool, they are not
# milestones, and nothing about them is exclusive.
[[upgrade]]
id = "u_whetstone"
name = "Whetstone"
desc = "Every weapon you own hits 8% harder"
effect = "w_all_damage"
value = 0.08
max_stacks = 6

