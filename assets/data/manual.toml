# The in-game manual. This is the same documentation the repo ships in
# docs/, trimmed to what fits on one screen of the 5x7 bitmap font (ASCII 32..96
# only: no lowercase, no accents, no box drawing) and split into pages so the
# reader can flip through them instead of scrolling.
#
# One [[page]] per screen. `lines` are drawn verbatim, one per row. A leading
# ">" is stripped and the line is drawn as a highlighted bullet; a leading "#"
# is stripped and the line is drawn as a sub-heading.
#
# loadContent() REJECTS any line containing a character the font cannot draw
# (see core::render::fontSupports), so a stray em dash fails the content load
# instead of rendering as a screen full of question marks.

# --- 1 -----------------------------------------------------------------------

