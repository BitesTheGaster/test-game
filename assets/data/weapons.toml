proj_speed = 40.0
proj_life = 1.2
pierce = 6
spread = 0.0
proj_color = [1.0, 0.95, 0.7, 1.0]

[[weapon]]
id = "shard"
name = "Frost Shards"
desc = "A tight volley of fast shards that shreds and chills whatever walks into it."
attack_type = "projectile"
damage = 12.0
cooldown = 0.45
projectiles = 4
proj_speed = 20.0
proj_life = 1.2
pierce = 0
spread = 0.34
