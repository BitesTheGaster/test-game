proj_color = [1.0, 0.6, 0.3, 1.0]
bomb_arc_height = 3.2
bomb_explode_radius = 2.6
bomb_knockback = 6.0
# A fuse means no contact detonation: the shell arcs clean over the first rank.
bomb_fuse = 0.35
# The whole difference from the Runic Hammer, which is otherwise the same arcing
# shell with a longer fuse and a wider blast: the shell finds whoever is nearest
# its aim line and lands this far PAST them. A hammer blows up what you were
# aiming at; a mortar fires THROUGH the thing in front of you. Without this the
# two were the same weapon with two sets of numbers.
bomb_ahead = 4.5

