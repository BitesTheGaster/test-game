# Base weapons. Modifiers come from upgrades.
#
# Weapon roles:
#   dagger  — fast twin hits, close-range flurry
#   wand    — balanced single bolt, reliable baseline
#   needle  — rapid tight stream, fast projectiles
#   flame   — wide spray, area denial at close range
#   ember   — very rapid spray, many small projectiles
#   shuriken— fast homing twins, track the target
#   fan     — very wide cone, close-range burst
#   crossbow— slow homing piercing bolt, hits through groups
#   hammer  — slow heavy AoE with knockback
#   scythe  — slow massive sweep, maximum pierce
#   orb     — rolling bomb that bounces and explodes
#   beam    — slow but instant, devastating single beam
#   storm   — evolution (wand + ember), lightning grid
#   nova    — evolution (orb + scythe), black star explosion
#
# - starter = true: one of these is rolled as the run-start weapon.
# - requires = [a, b]: evolution weapon, offered as a level-up grant once you
#   own both prerequisites (NOT in the normal random grant pool before that).
# - area: explosion radius on impact (splash damage).
# - strength: knockback force applied to the hit enemy.
# - homing: projectile steers toward the nearest enemy each tick.
# - bounces: number of wall bounces after the first impact.

