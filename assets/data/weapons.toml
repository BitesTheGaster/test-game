[[weapon]]
id = "mortar"
name = "Siege Mortar"
desc = "Fires over the crowd. The shell sails past the front rank on purpose and cooks whatever is behind it."
attack_type = "bomb"
damage = 62.0
cooldown = 2.40
projectiles = 1
proj_speed = 9.0
proj_life = 2.6
pierce = 0
# A salvo card is only honest if extra shells land somewhere different.
