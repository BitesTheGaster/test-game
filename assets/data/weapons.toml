# --- Base weapons, second wave ------------------------------------------------
# Same rules as the first block: no `requires` means the weapon can be rolled as
# an ordinary weapon card, and any two of these can seed an evolution. Each one
# leans on a field the first wave did not need, so they do not play like reskins:
# pierce-heavy slug, wide fast volley, lobbed shell, ricocheting puck, planted
# beacon, tight fast cone, self-centered ring, player-centered lash, short chain.

[[weapon]]
id = "railgun"
name = "Rail Rifle"
desc = "One hypervelocity slug. Slow to load, punches through an entire rank."
attack_type = "projectile"
damage = 78.0
cooldown = 1.80
