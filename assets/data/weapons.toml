# Base weapons. Modifiers come from upgrades.
#
# Attack types:
#   projectile  - standard aimed projectile(s) with spread
#   orbit       - blades orbit player, deal contact damage
#   cone        - instant AoE cone in aim direction
#   bomb        - slow arcing projectile with gravity, explodes on impact
#   boomerang   - projectile goes out to max range, returns to player
#   bounce      - one eternal projectile that bounces between enemies
#   beam        - instant hitscan line
#   sweep       - circle area reaped around the nearest enemy
#   zone        - creates persistent damage zone on ground
#   chain       - lightning jumps between enemies (evolution)
#   nova        - expanding ring from player (evolution)
#   inferno     - circle reap + burning ground (evolution)
#   pulsar      - boomerang that drags a damage trail (evolution)
#   vortex      - rotating suction zones that drag enemies inward (super)
#   prism       - N locked beams, one per target (super)
#
# - starter = true: one of these is rolled as the run-start weapon.
# - requires = [a, b]: evolution weapon, offered as a level-up grant once you
#   own both prerequisites (NOT in the normal random grant pool before that).

[[weapon]]
