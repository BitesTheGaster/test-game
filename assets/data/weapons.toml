# The Crossbow was strictly better at everything that mattered: 20 damage that
# pierces four bodies, and homing so it never misses. A baseline the player can
# see through is not a baseline, it is a trap. The Wand's answer is rate and
# range rather than a bigger single hit, which is the one axis the Crossbow
# cannot compete on.
cooldown = 0.34
projectiles = 1
proj_speed = 20.0
proj_life = 1.2
pierce = 0
spread = 0.10
proj_color = [1.0, 0.95, 0.55, 1.0]
