# The ice is ice. A 30% chill for 1.2s is barely a statline on its own; what it
# buys is that the volley slows a whole group at once, so the shards land on
# enemies that stayed in the pack instead of on the one that ran to the front.
# Rime Lances deepens this to a real freeze.
