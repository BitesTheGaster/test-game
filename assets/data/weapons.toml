[[weapon]]
id = "pulsar"
name = "Pulsar"
desc = "Shuriken + Lance. A light-chakram that burns the WHOLE LINE it flies, out and back, not just the blade tip - it carves corridors."
attack_type = "pulsar"
damage = 12.0
cooldown = 0.90
projectiles = 1
proj_speed = 20.0
proj_life = 2.0
# The blade is a light chakram, not a throwing star: it goes THROUGH a rank rather
# than stopping in it. This is the answer to the obvious question about this
# weapon -- no, the point is not infinite pierce. The point is the trail (below),
# and the blade's own pierce is only high enough that the chakram never gets
# bogged down before its trail has done the work.
pierce = 5
spread = 0.12
proj_color = [0.55, 1.0, 1.0, 1.0]
requires = ["beam", "shuriken"]
boomerang_range = 6.5
boomerang_return_speed = 2.4
# Wide on purpose. The trail covers the blade's whole remembered path, so this is
# literally the width of the corridor the weapon burns -- at 0.5 the corridor was
# narrower than the blade's own reach and hit exactly what the blade already hit,
# which is why the weapon looked like a prettier shuriken and not like anything.
# 1.3 puts the scar's edge a clear half-unit outside anything the blade can touch
# on its own, so the trail is visibly a thing that reaches further than the blade.
beam_width = 1.3

[[weapon]]
id = "halo"
name = "Radiant Halo"
desc = "Dagger + Lance. Blades of light walk a slow circle around you - with a ring of safe ground at your feet. They cut what they cross, not what hugs you."
attack_type = "halo"
