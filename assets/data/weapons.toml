# Base weapons. Modifiers come from upgrades.
#
# Weapon roles (each must FEEL completely different):
#   wand      — single reliable bolt, the baseline "pistol"
#   dagger    — rapid twin blades, melee-range flurry, high DPS up close
#   crossbow  — slow heavy piercing bolt that homing-tracks, punches lines
#   hammer    — very slow artillery, massive AoE splash + knockback
#   orb       — slow rolling bomb that bounces off walls/enemies, explodes
#   beam      — instant-hit channeled laser, continuous damage while firing
#   scythe    — wide sweeping arc in front, cleaves everything in cone
#   needle    — rapid stream of hair-thin projectiles, sustained DPS
#   storm     — evolution (wand + needle): grid of homing chain lightning
#   nova      — evolution (orb + hammer): giant meteor, bounces, massive boom
#
# - starter = true: one of these is rolled as the run-start weapon.
# - requires = [a, b]: evolution weapon, offered as priority grant once both owned.
# - area: explosion radius on impact (splash damage at 50%).
# - strength: knockback force applied to the hit enemy.
# - homing: projectile steers toward nearest enemy each tick.
# - bounces: number of wall/enemy bounces after first impact.
# - shape: visual projectile shape (circle, rect, line, triangle, star, large_circle)

