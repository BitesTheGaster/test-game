# --- Evolutions (A+B = C) ----------------------------------------------------

[[weapon]]
id = "storm"
name = "Storm Caller"
desc = "Wand + Crossbow. The wand's bolt keeps the crossbow's punch: it drives into a body and bends onto the next one, so it never leaves the pack."
attack_type = "projectile"
damage = 15.0
cooldown = 0.60
projectiles = 1
proj_speed = 24.0
proj_life = 1.4
# The crossbow's punch-through, spent on steering instead of reach. This is the
# whole merge: the Crossbow pierces four bodies in a straight line and the last
# one is the far end of the crowd, while the Wand always hits what it is aimed
# at. A bolt that spends the same budget on DIRECTION gets both at once -- it
# keeps the punch, and it keeps hitting as long as there is somebody left to
# bend onto. The cost is the honest one: nothing here reaches further than a
# straight bolt would, so on a lone target this is the worse weapon, and the
# payoff only exists where the pack does.
pierce = 4
spread = 0.0
proj_color = [0.55, 1.0, 1.0, 1.0]
requires = ["wand", "crossbow"]
# How far it can see for the next body from where it just landed, and how hard it
# can bend in a single step. The turn is a LIMIT, not a snap to the new heading:
# a perfect seeker would make the crossbow half of the pairing decorative, and a
# body already peeling away can still get behind something.
reaim_range = 4.2
reaim_turn = 0.22

[[weapon]]
id = "nova"
name = "Void Nova"
desc = "Orb + Hammer. A ring cast wide that rushes back in, dragging the horde to a knot, then detonates on top of them."
attack_type = "nova"
damage = 40.0
cooldown = 1.80
projectiles = 1
proj_speed = 0.0
proj_life = 0.0
pierce = 0
spread = 0.0
proj_color = [0.5, 0.3, 1.0, 1.0]
requires = ["orb", "hammer"]
nova_max_radius = 5.0
nova_expand_speed = 4.0
nova_damage_per_tick = 35.0
nova_tick_rate = 0.12
# The Shock Core is a wall going OUT, shoving the crowd into open ground. This is
# the exact inverse: cast at full radius, drag everything inward, and go off at
# the centre. Without it the two were the same nova with a bigger number on it,
# which is precisely what Void Nova was. The orb half of the pairing is the drag
# and the hammer half is the burst.
nova_contract = true
nova_pull = 7.0
nova_burst_damage = 90.0

