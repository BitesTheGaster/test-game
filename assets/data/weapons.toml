[[weapon]]
id = "eventhorizon"
name = "Event Horizon"
desc = "Rail Rifle + Shock Core + Ember Sprayer. Four wells circle you, swallow the horde, then COLLAPSE - each implosion is a blast and the well reopens across the orbit. A flat tick, on a clock."
attack_type = "vortex"
damage = 48.0
cooldown = 1.00
projectiles = 4
proj_speed = 0.0
proj_life = 0.0
pierce = 6
spread = 0.0
proj_color = [0.52, 0.36, 0.92, 1.0]
requires = ["railgun", "shockcore", "flame"]
vortex_radius = 1.5
vortex_reach = 3.2
# Half the Gyre's grip on purpose. This well has three seconds to gather and then
# pays out in one implosion, so all it needs is enough drag to hold a knot still
# long enough to reach the clock -- and a stronger permanent drag would make it
# the Gyre again.
vortex_pull = 4.0
vortex_orbit = 3.0
vortex_orbit_speed = 1.9
vortex_tick_rate = 0.10
# This is the whole difference from the Void Gyre, which is the same well with a
# larger number on it. The Gyre never ends: it is a patient permanent drag whose
# damage is a steady drip, and you can build a position around it. These wells
# hoard for three seconds and then implode - a lump of damage on a clock the
# player can read, with the well reopening across the orbit so the knot it just
# made is dragged toward a spot that is about to stop existing.
vortex_collapse_at = 3.0
vortex_burst_damage = 110.0
vortex_burst_radius = 3.4
# No crowd bonus, and the tick is not feeble: this well is paid by the clock, so
# it has to be worth holding on its own against a straggler. The two numbers
# together are the difference between the two weapons -- a snare that multiplies,
# and a charge that does not.
vortex_crowd = 0.0

[[weapon]]
id = "rimewake"
name = "Hoarfrost Wake"
desc = "Frost Shards + Void Orb. The shards drag a freezing, grinding bubble behind them - everything the volley PASSES walks in slow and comes apart, hit or not."
attack_type = "projectile"
damage = 9.0
cooldown = 0.55
projectiles = 3
proj_speed = 16.0
proj_life = 1.6
# It goes through, but it does not have to: the aura is the weapon, and the shard
# is only the thing carrying it. Pierce is moderate on purpose -- a shard that
# stopped at the first two bodies would spend half its flight buried inside the
# pack, which is exactly where nobody needs slowing.
pierce = 3
spread = 0.30
proj_color = [0.62, 0.86, 1.0, 1.0]
requires = ["shard", "orb"]
# The direct hit, kept. This is a Frost Shards build and it should still cut.
chill_mul = 0.55
chill_time = 1.4
# The carried corona: the actual point of the evolution. Chill is an on-HIT
# status, so Frost Shards only ever slowed the bodies a shard went through --
# which meant it had to keep hitting to keep slowing, and the back of the horde
# was never touched at all. This is the other kind of cold: a bubble that travels
# with the shard and grinds and slows everything it passes, aimed at or not.
aura_radius = 1.5
aura_dps = 26.0
aura_tick = 0.10
# Weaker than a direct hit on purpose -- the aura cannot stop anything from being
# behind the shard, it only makes everything it passes walk into the shard more
# slowly. The direct hit is what actually kills.
aura_chill_mul = 0.62
aura_chill_time = 0.9
