spread = 0.0
proj_color = [0.80, 0.50, 1.0, 1.0]
requires = ["pinball", "orb"]
# Lower than the Pinball's own budget on purpose: the fragments are what does
# the hitting, and the cascade is already bounded by depth (kMaxBounceSplitDepth)
